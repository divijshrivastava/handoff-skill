name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check_versions.py
      - run: python -m unittest discover -s skills/handoff/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python skills/handoff/scripts/handoff_guard.py validate --root .
      - run: python scripts/package_skill.py
      - run: git diff --check

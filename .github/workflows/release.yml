name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('skills/handoff/SKILL.md').read_text()
          version = re.search(r'^  version: "([0-9]+\.[0-9]+\.[0-9]+)"$', text, re.M).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match skill metadata.version'
          PY
      - run: python -m unittest discover -s skills/handoff/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python skills/handoff/scripts/handoff_guard.py validate --root .
      - run: python scripts/package_skill.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/handoff.zip dist/handoff.skill dist/SHA256SUMS --verify-tag --generate-notes
